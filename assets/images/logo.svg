<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" role="img" aria-label="Silver Springs Care Logo">
  <!-- Brand Emblem: Flowing Springs & Growth Curves -->
  <g transform="translate(6, 6)">
    <!-- Outer spring arc - deep navy / forest green -->
    <path d="M 28 4 C 14 4, 4 15, 4 29 C 4 43, 15 54, 29 54 C 36 54, 43 51, 48 45 C 46 45, 43 45, 40 44 C 30 40, 24 31, 24 20 C 24 13, 27 7, 32 3 C 30.7 3.3, 29.3 3.6, 28 4 Z" fill="#17233B" opacity="0.95"/>
    <!-- Inner growth leaf curve - forest green -->
    <path d="M 29 11 C 21 16, 17 24, 18 33 C 19 41, 25 48, 33 49 C 42 50, 50 43, 51 34 C 52 24, 43 14, 29 11 Z" fill="#397B50"/>
    <!-- Fresh Sage spring ripple accent -->
    <path d="M 33 19 C 28 23, 27 29, 29 35 C 31 40, 36 43, 41 42 C 45 41, 47 37, 47 32 C 47 25, 41 20, 33 19 Z" fill="#A9C9A5"/>
    <!-- Center spark of agency / life -->
    <circle cx="37" cy="28" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(74, 16)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#17233B" letter-spacing="-0.02em">SILVER SPRINGS</text>
    <text x="180" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#397B50" letter-spacing="0.06em"> CARE</text>
    <text x="1" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#596579" letter-spacing="0.14em">DISABILITY SUPPORT &amp; CARE SERVICES</text>
  </g>
</svg>
